version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm install -g pnpm@latest
        - pnpm install --shamefully-hoist
    build:
      commands:
        - echo "DATABASE_URL=${DATABASE_URL:-postgresql://neondb_owner:npg_baVm3rz1LYpg@ep-falling-block-axoykj3b-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require}" >> .env.production
        - echo "AUTH_SECRET=${AUTH_SECRET:-/k61dCV/sZHWk/+qSz9vKNeL9kf3xV100wKZ5NfJcIY=}" >> .env.production
        - echo "AUTH_TRUST_HOST=true" >> .env.production
        - echo "AUTH_URL=${AUTH_URL:-https://main.d3tum10bqcbo66.amplifyapp.com}" >> .env.production
        - cp .env.production .env || true
        - pnpm run build
        - cp .env.production .next/.env.production || true
        - cp .env.production .next/.env || true
        - mkdir -p .next/node_modules
        - cp -r node_modules/pg* .next/node_modules/ 2>/dev/null || true
        - cp -r node_modules/postgres-* .next/node_modules/ 2>/dev/null || true
        - |
          for d in .next/node_modules/pg-*; do
            if [ -d "$d" ]; then
              mkdir -p "$d/node_modules"
              cp -r node_modules/pg* "$d/node_modules/" 2>/dev/null || true
              cp -r node_modules/postgres-* "$d/node_modules/" 2>/dev/null || true
            fi
          done
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
