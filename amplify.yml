version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || nvm install 20
        - npm install -g pnpm@latest
        - pnpm install
    build:
      commands:
        - env | grep -E '^(DATABASE_URL|AUTH_SECRET)' >> .env.production || true
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
